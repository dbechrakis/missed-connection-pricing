name: Watch BTS for the pre-registered months

# The pre-registered test (PREREGISTRATION_2026H2.md and its addenda) runs on September to December 2026,
# months that did not exist when the expectations were frozen. This job checks every Monday whether BTS has
# published them, and opens one issue per month when it has, so the test is run as soon as it can be and
# nobody can quietly skip a month that came out badly. It only reads public URLs; it never runs the test itself
# (that needs the full 2024-2026 build, about 1 GB of downloads).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue for each newly published month
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # v1 and v2 read the Reporting Carrier file; v3 and v4 read the Marketing Carrier file. BTS publishes them
          # separately, so a month is ready only when both answer.
          for m in 9 10 11 12; do
            rep="https://transtats.bts.gov/PREZIP/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_2026_${m}.zip"
            mkt="https://transtats.bts.gov/PREZIP/On_Time_Marketing_Carrier_On_Time_Performance_Beginning_January_2018_2026_${m}.zip"
            c_rep=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 60 "$rep" || echo 000)
            c_mkt=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 60 "$mkt" || echo 000)
            title="BTS published 2026-$(printf %02d $m): run the pre-registered test"
            echo "2026-$m: Reporting Carrier HTTP $c_rep, Marketing Carrier HTTP $c_mkt"
            if [ "$c_rep" = "200" ] && [ "$c_mkt" = "200" ] && [ -z "$(gh issue list -R "$REPO" --state all --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
              gh issue create -R "$REPO" --title "$title" --body "BTS on-time data for 2026-$(printf %02d $m) is available in both files the tests read:

          - Reporting Carrier (v1 and v2, PREREGISTRATION_2026H2.md and its addendum): $rep
          - Marketing Carrier (v3 and v4, PREREGISTRATION_2026H2_V3.md and _V4.md): $mkt

          Follow the procedure of each pre-registration exactly, with no retuning. The first read runs when September to November are all published; the December read is described in VALIDATION.md 5M. Nothing else may score these months first, the monthly job included. Report every pre-registered number, pass or fail."
            fi
          done
